name: cd
on:
 workflow_run:
   workflows: ['ci']
   types: [completed]
   branches: [main]

jobs:
  deploy:
   if: ${{ github.event.workflow_run.conclusion=='success' }}  
   runs_on: ubuntu-latest

   steps:
     - uses: appleboy/ssh-action@v1
       with:
         host: ${{ secrets.EC2_HOST }}
         username: ${{ secrets.EC2_USER }} 
         key: ${{ secrets.EC2_SSH_KEY }}
         script:
           if [ ! -d ~/github-actions-kubernetes-masterclass ]; then
             git clone ${{github.server.url}}/${{github.repository}}.git ~/github-actions-kubernetes-masterclass
           fi
           cd ~/github-actions-kubernetes-masterclass
           git pull origin main
           if [ ! -f .env ]; then
            echo "ERROR:~/github-actions-kubernetes-masterclass/.env is missing. create it once with DOCKERHUB_USERNAME and DB credentials." 
            exit 1
           fi
           docker compose pull
           docker compose up -d --build
           docker images prune -f  
